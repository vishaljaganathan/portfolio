<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator | MCA Lab Exercise</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="display">
                <div class="history" id="history"></div>
                <div class="result" id="result">0</div>
            </div>
            
            <div class="buttons">
                <!-- Scientific Functions Row 1 -->
                <button class="btn fn" onclick="calculate('sin')">sin</button>
                <button class="btn fn" onclick="calculate('cos')">cos</button>
                <button class="btn fn" onclick="calculate('tan')">tan</button>
                <button class="btn fn" onclick="calculate('log')">log</button>
                <button class="btn fn" onclick="calculate('ln')">ln</button>

                <!-- Scientific Functions Row 2 -->
                <button class="btn fn" onclick="calculate('sqrt')">√</button>
                <button class="btn fn" onclick="calculate('square')">x²</button>
                <button class="btn fn" onclick="calculate('power')">x^y</button>
                <button class="btn fn" onclick="appendValue('(')">(</button>
                <button class="btn fn" onclick="appendValue(')')">)</button>
                
                <!-- Main Pad -->
                <button class="btn clear action" onclick="clearDisplay()">C</button>
                <button class="btn action" onclick="deleteLast()">DEL</button>
                <button class="btn fn" onclick="calculate('pi')">π</button>
                <button class="btn fn" onclick="calculate('e')">e</button>
                <button class="btn operator" onclick="appendValue('/')">÷</button>
                
                <button class="btn number" onclick="appendValue('7')">7</button>
                <button class="btn number" onclick="appendValue('8')">8</button>
                <button class="btn number" onclick="appendValue('9')">9</button>
                <button class="btn fn" onclick="calculate('fact')">n!</button>
                <button class="btn operator" onclick="appendValue('*')">×</button>
                
                <button class="btn number" onclick="appendValue('4')">4</button>
                <button class="btn number" onclick="appendValue('5')">5</button>
                <button class="btn number" onclick="appendValue('6')">6</button>
                <button class="btn fn" onclick="calculate('exp')">exp</button>
                <button class="btn operator" onclick="appendValue('-')">-</button>
                
                <button class="btn number" onclick="appendValue('1')">1</button>
                <button class="btn number" onclick="appendValue('2')">2</button>
                <button class="btn number" onclick="appendValue('3')">3</button>
                <button class="btn fn" onclick="calculate('inv')">1/x</button>
                <button class="btn operator" onclick="appendValue('+')">+</button>
                
                <button class="btn number" onclick="appendValue('0')">0</button>
                <button class="btn number" onclick="appendValue('.')">.</button>
                <button class="btn fn" onclick="calculate('percent')">%</button>
                <button class="btn equals operator" onclick="evaluateExpression()">=</button>
            </div>
        </div>
        <a href="../../index.html#lab-exercises" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
